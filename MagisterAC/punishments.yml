punishments:
  enabled: true

  actions:
    warn:
      command: "msg {player} {reason}"
    kick:
      command: "kick {player} {reason}"
    tempban:
      command: "tempban {player} {duration} {reason}"
    ban:
      command: "ban {player} {reason}"

  default-reasons:
    killaura: "Использование KillAura"
    reach: "Аномальный радиус атаки"
    speed: "Читерная скорость движения"
    fly: "Использование полёта"
    scaffold: "Scaffold hack"
    timer: "Timer hack"

  auto-punish:
    enabled: true
    checks:
      killaura:
        action: kick
        reason: "{default-reasons.killaura}"
      fly:
        action: kick
        reason: "{default-reasons.fly}"
      speed:
        action: kick
        reason: "{default-reasons.speed}"
