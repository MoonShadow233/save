# ════════════════════════════════════════════════════════════════════════════
#  MagisterAC — 检查配置
#
#  下面的每一项检查默认均已启用（enabled: true）。如需关闭某项检查，
#  将其 enabled 设为 false。类别：combat（战斗）、movement（移动）、world（世界）、packet（数据包）。
#
#  ProtocolLib：绝大多数检查使用普通的 Bukkit 事件，无需任何额外依赖。只有
#  以下这些 PACKET（数据包）检查需要 ProtocolLib 插件，缺少它时
#  会静默失效：
#      packet.badpackets, packet.timer, packet.blink,
#      packet.pingspoof, packet.antibot, packet.antidisabler
#  （combat.phantomtrap 也需要 ProtocolLib。）其余所有检查——包括
#  packet.freecam 和 packet.replaymod——无需 ProtocolLib 即可工作。
# ════════════════════════════════════════════════════════════════════════════
combat:
  killaura:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    rotations-per-tick: 3
    # 玩家视线方向与目标之间的最大夹角（度）。
    # 原版战斗通常远低于此值；夹角越大，说明玩家
    # 击中了自己并未瞄准的目标——这正是经典的 KillAura 特征。
    max-angle: 60.0
    # 触发多重光环信号前，玩家在一个短暂时间窗口内
    # 可命中的其他不同实体数量（原版 PvP 一次只能命中一个目标）。
    max-targets-per-window: 1
    # 攻击被实际取消前所需累积的内部触发次数（一次干净命中会使计数衰减），
    # 因此单次误判绝不会妨碍正常的合法战斗。
    cancel-vl: 2
  reach:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-reach: 3.2
    max-reach-creative: 5.0
    # 触发告警前的 VL 缓冲（用于吸收单 tick 的延迟尖峰）。
    vl-threshold: 2
  aimassist:
    enabled: true
    max-vl: 25
    punish-vl: 20
    cancel: false
    deviation-threshold: 0.15
    # 旋转 GCD 启发式检测（仅限战斗）。标记未经量化（作弊注入）的
    # 旋转。告警优先：punish-vl 较高，不取消。若误报较多，可调高 gcd-min。
    gcd-enabled: true
    gcd-min: 0.0006
    gcd-streak: 6
  autoclicker:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: false
    max-cps: 20
    min-tick-diff: 2
  triggerbot:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    react-time-threshold: 40
  criticals:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: true
  velocity:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    min-velocity-percent: 70
    # 触发告警前连续未受击退的 tick 数（延迟容忍度）。
    vl-threshold: 3
  hitbox:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: true
    expand: 0.1
  # 幻影陷阱（KillAura/Aimbot）。仅供管理员通过玩家面板手动启用。
  # 在嫌疑人身后生成一个不可见的假玩家（需要 ProtocolLib）；
  # 攻击它时会触发 KillAura 的 "PhantomHit" 告警。仅供人工审查——绝不会自动封禁。
  phantomtrap:
    enabled: true
    distance: 2.0
    despawn-seconds: 8

movement:
  fly:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-y-speed: 0.42
  speed:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-speed-multiplier: 0.3
  nofall:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: true
    min-fall-distance: 3.0
  jesus:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
  spider:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
  step:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: true
    max-step-height: 0.6
  glide:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: true
  elytrafly:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-elytra-speed: 1.5
  # GroundSpoof — 客户端声称 onGround=true，但其下方并无方块。
  # 告警优先：punish-vl 较高，不取消（取消动作在延迟时可能导致橡皮筋回弹）。
  groundspoof:
    enabled: true
    max-vl: 30
    punish-vl: 25
    cancel: false
    vl-threshold: 5
  # NoSlow — 使用物品（吃/喝/弓/盾牌）时仍保持（接近）全速。
  noslow:
    enabled: true
    max-vl: 30
    punish-vl: 25
    cancel: false
    use-speed-factor: 0.36
    vl-threshold: 4
  # Sprint — 全方位冲刺（向后移动）或使用物品时仍处于冲刺状态。
  sprint:
    enabled: true
    max-vl: 30
    punish-vl: 25
    cancel: false
    min-forward-dot: -0.6
    vl-threshold: 4

world:
  scaffold:
    enabled: true
    max-vl: 25
    punish-vl: 20
    cancel: true
    min-place-time: 50
  fastbreak:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
  fastplace:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-place-per-second: 10
  nuker:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-blocks-per-tick: 2
  autotool:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: false
    min-switch-time: 100
  autoarmor:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: false
  inventorymove:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true

# 注意：下面的 badpackets、timer、blink、pingspoof、antibot 和 antidisabler
# 需要 ProtocolLib（缺少时静默失效）。freecam 和 replaymod 则不需要。
packet:
  badpackets:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
  timer:
    enabled: true
    max-vl: 25
    punish-vl: 20
    cancel: true
    # 令牌桶计时器：移动数据包的平均间隔应为约 50ms（20/秒）。
    # 仅当客户端持续高速运行并累积出这么多毫秒的
    # “超实时”余量时才触发告警。数值越高，在延迟/LAN 环境下误报越少。
    balance-limit-ms: 1000
  blink:
    enabled: true
    max-vl: 20
    punish-vl: 15
    cancel: true
    max-position-buffer: 20
  pingspoof:
    enabled: true
    max-vl: 15
    punish-vl: 10
    cancel: false
    max-ping: 800
    # Keep-alive 往返抖动必须保持在 'min-variance' 之上，但只有
    # 当平均 ping >= 'min-mean-for-spoof' 时，低抖动才会被视为伪造。
    # 低延迟/LAN 玩家天然抖动较低，绝不应被触发告警。
    min-variance: 4.0
    min-mean-for-spoof: 80.0
    max-reported-deviation: 200.0
  antibot:
    enabled: true
    max-joins-per-second: 5
    similar-name-threshold: 3
  antidisabler:
    enabled: true
    max-vl: 20
    punish-vl: 15
  # Freecam（脱离身体的自由视角相机）检测。仅告警优先：它绝不会
  # 取消游戏操作，并且有意不出现在 punishments.yml 中，因此管理员
  # 只会收到通知——不会有自动踢出/封禁。通过 'enabled' 开关。
  # 无需 ProtocolLib 即可工作。包含两层检测，均仅告警：
  #   - HEURISTIC（启发式）：标记 freecam 的典型特征——身体原地不动，
  #     而视角旋转，玩家能触及远超正常范围的方块/实体，
  #     同时伴有闪烁/回退式瞬移（冻结窗口结束后的大幅跳跃）。
  #     旁观模式、创造模式和载具中的玩家将被豁免。
  #   - SIGNATURE（签名）：识别声明了 "freecam" 插件通道或客户端品牌名的客户端。
  # 按玩家豁免：magisterac.bypass.freecam。
  freecam:
    enabled: true
    cancel: false
    # --- 启发式阈值 ---
    # 身体在每次采样中移动量低于或等于该值（方块）时，即视为“静止”。
    pos-epsilon: 0.08
    # 身体必须先保持冻结至少该时长（毫秒），之后才可能被标记。
    min-frozen-ms: 1500
    # 冻结窗口期间所需的累计视角旋转量（度）。
    rotation-threshold: 25.0
    # 被视为“远程”的交互距离（方块）（正常触及距离约 4.5）。
    reach-threshold: 6.5
    # 冻结窗口结束后立即出现大于该值（方块）的位置跳跃，
    # 将被视为闪烁/回退式瞬移。
    snapback-distance: 5.0
    # 与客户端品牌名以及所有已注册插件通道进行匹配的子字符串（不区分大小写）。
    # 如果你知道某个特定版本的名字，可以添加更多。
    signatures:
      - freecam
      - free-cam
      - freelook
      - free-look
  # ReplayMod（客户端录制）检测。仅告警优先——参见上方 freecam。
  # 按玩家豁免：magisterac.bypass.replaymod。
  replaymod:
    enabled: true
    cancel: false
    signatures:
      - replaymod
      - replay-mod
      - replay_mod
