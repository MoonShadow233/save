prefix: "&8[&bMagisterAC&8]&r"
debug: false
# 所有面向用户文本所使用的插件语言。
# 支持：ru（俄语）、en（英语）、de（德语）、zh（中文）、es（西班牙语）、ar（阿拉伯语）、uk（乌克兰语）、pl（波兰语）。
# "auto" 将跟随此 jar 内建的语言（例如 MagisterAC-de.jar -> 德语）。
# 在此设置具体代码将始终覆盖 jar 内建的语言。
language: zh

server:
  name: "My Server"
  timezone: "Europe/Moscow"

notifications:
  violation-threshold: 10
  alert-cooldown: 3000

checks:
  enabled: true
  global-bypass-permission: "magisterac.bypass"

log:
  violations: true
  joins: true
  commands: true
