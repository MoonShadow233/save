global:
  # 自动版本更新器的设置
  auto updater:
    notify: true
    download: false
    
    # 等待新更新下载的秒数
    delay: 43200 # 12 小时
 
  metrics: true

  # 向拥有 protocol.info 权限的玩家打印某些警告
  chat warnings: true
  
  # 自动编译结构修改器
  background compiler: true
  
  # 针对给定的 Minecraft 版本禁用版本检查。请先备份你的世界！
  ignore version check: 

  # 是否启用 filter 命令
  debug: false
  
  # 是否在每次警告时打印堆栈跟踪（stack trace）
  detailed error: false
  
  # filter 命令使用的引擎
  script engine: JavaScript
  
  suppressed reports: