# QuickShop-Hikari 图形界面配置
# 配置所有 GUI 菜单的外观与布局
# 
# 每个图标支持以下属性：
#   material: 材质类型（例如 PAPER、BARRIER、LIME_CONCRETE）
#   name: 显示名称（支持 MiniMessage 格式）
#   lore: 物品描述行列表（支持 MiniMessage 格式）
#   custom-model-data: 资源包的自定义模型数据（整数，可选）
#   slot: 物品栏中的槽位（0-53）
#   amount: 物品数量（默认：1）
#
# 文本选项：
#   1. 直接内联文本：直接编写 MiniMessage 格式的文本
#      示例：name: "<bold><green>Buy Items</green></bold>"
#
#   2. 空名称：使用单个空格 " " 作为空白显示名称
#      示例：name: " "
#
# MiniMessage 格式参考：https://docs.advntr.dev/minimessage/format.html
# 常用标签：<bold>、<italic>、<red>、<green>、<yellow>、<aqua>、<gradient:color1:color2>
# 如果想使用语言文件中的值作为显示名称或描述，请在值前加上 "lang:"

version: 3

# ===================
# 全局样式设置
# ===================
style:
  border-material: GRAY_STAINED_GLASS_PANE
  accent-positive: LIME_CONCRETE
  accent-negative: ORANGE_CONCRETE
  accent-neutral: LIGHT_BLUE_CONCRETE

# ===================
# 交易菜单
# ===================
trade:
  title: lang:gui.trade.title
  rows: 6
  
  # 边框配置 - 灰色营造现代感
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    custom-model-data: 0
    rows:
      # 顶部、中间分隔、底部
      - 1
      - 4
      - 6
  
  # 商店物品显示（正在交易的物品）- 位于第 2 行居中
  shop-item:
    slot: 13
  # 注意：material、name、lore 均取自实际商店物品

  # 信息图标行（第 3 行）
  info-stock:
    material: CHEST
    name: lang:gui.trade.info-stock.display
    lore:
    - lang:gui.trade.info-stock.lore
    custom-model-data: 0
    slot: 21
  
  info-price:
    material: GOLD_INGOT
    name: lang:gui.trade.info-price.display
    lore:
    - lang:gui.trade.info-price.lore
    custom-model-data: 0
    slot: 22
  
  info-seller:
    material: PLAYER_HEAD
    name: lang:gui.trade.info-seller.display
    lore:
    - lang:gui.trade.info-seller.lore
    custom-model-data: 0
    slot: 23
  
  # 自定义数量按钮 - 使用 NAME_TAG 直观表示"输入数量"
  custom-amount:
    material: NAME_TAG
    name: lang:gui.trade.custom-amount.display
    custom-model-data: 0
    slot: 43
  
  # 数量按钮（第 5 行）- 按购买/出售区分颜色
  # {0} = 总价
  quantity-buttons:
    material-buy: LIME_CONCRETE
    material-sell: ORANGE_CONCRETE
    custom-model-data: 0
    slots:
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    quantities:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 64
    lore:
    - lang:gui.trade.quantity-button.lore
  
  # 关闭按钮 - 位于底部居中
  close:
    material: BARRIER
    name: lang:gui.shared.close.display
    custom-model-data: 0
    slot: 49

# ===================
# 店主菜单（店主控制面板）
# ===================
keeper:
  title: lang:gui.keeper.title
  rows: 4
  
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    custom-model-data: 0
    rows:
      # 分隔行与底部
      - 2
      - 4
  
  # 商店物品预览 - 顶部居中
  shop-item:
    slot: 4
  
  # 修改价格按钮 - 使用 GOLD_NUGGET 表示"价格"
  # {0} = 当前价格
  change-price:
    material: GOLD_NUGGET
    name: lang:gui.keeper.change-price.display
    lore:
    - lang:gui.keeper.change-price.lore
    custom-model-data: 0
    slot: 19
  
  # 模式切换（购买/出售/冻结）- 使用混凝土保持简洁外观
  # {0} = 当前模式，{1} = 下一模式
  mode-toggle:
    selling:
      material: LIME_CONCRETE
      custom-model-data: 0
    buying:
      material: ORANGE_CONCRETE
      custom-model-data: 0
    frozen:
      material: LIGHT_BLUE_CONCRETE
      custom-model-data: 0
    name: lang:gui.keeper.mode-toggle.display
    lore:
    - lang:gui.keeper.mode-toggle.lore
    slot: 21
  
  inventory:
    material: CHEST
    name: lang:gui.keeper.inventory.display
    lore:
    - lang:gui.keeper.inventory.lore
    slot: 22
  
  # 店员管理按钮
  staff:
    material: PLAYER_HEAD
    name: lang:gui.keeper.staff.display
    lore:
    - lang:gui.keeper.staff.lore
    custom-model-data: 0
    slot: 23
  
  # 历史记录按钮
  history:
    material: BOOK
    name: lang:gui.keeper.history.display
    lore:
    - lang:gui.keeper.history.lore
    custom-model-data: 0
    slot: 24
  
  # 移除商店按钮 - 使用 TNT 营造醒目效果
  remove:
    material: TNT
    name: lang:gui.keeper.remove.display
    lore:
    - lang:gui.keeper.remove.lore
    custom-model-data: 0
    slot: 25
  
  # 关闭/返回按钮 - 使用 OAK_DOOR 表示"退出"
  close:
    material: OAK_DOOR
    name: lang:gui.shared.close.display
    custom-model-data: 0
    slot: 31

# ===================
# 店员菜单
# ===================
staff:
  title: lang:gui.staff.title
  rows: 6
  
  # 第 1 行在空槽位显示边框（按钮在其所在槽位覆盖边框）
  # 第 6 行是底部的分页/控制行
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    custom-model-data: 0
    rows:
    - 1
    - 6
  
  # 搜索按钮 - 打开聊天输入框以搜索玩家
  # {0} = 当前搜索关键词或 "None"
  search:
    material: ANVIL
    name: lang:gui.staff.search.display
    lore:
    - lang:gui.staff.search.lore
    custom-model-data: 0
    slot: 0
  
  # 添加店员按钮 - 使用 EMERALD（绿色 = 添加）
  add-staff:
    material: EMERALD
    name: lang:gui.staff.add-staff.display
    lore:
    - lang:gui.staff.add-staff.lore
    custom-model-data: 0
    slot: 4
  
  # 返回按钮 - 使用 OAK_DOOR 表示"返回"
  back:
    material: OAK_DOOR
    name: lang:gui.shared.back.display
    custom-model-data: 0
    slot: 8
  
  # 分页控制（底部行）
  previous-page:
    material: ARROW
    name: lang:gui.shared.previous-page.display
    custom-model-data: 0
    slot: 48
  
  next-page:
    material: ARROW
    name: lang:gui.shared.next-page.display
    custom-model-data: 0
    slot: 50
  
  page-info:
    material: BOOK
    name: lang:gui.shared.page-info.display
    custom-model-data: 0
    slot: 49
  
  # 店员列表从第 2 行开始（槽位 9+）
  list-start-slot: 9

# ===================
# 历史记录菜单
# ===================
history:
  title: lang:history.shop.gui-title
  rows: 6
  
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    custom-model-data: 0
    rows:
    - 1
    - 6
  
  entry:
    material: PLAYER_HEAD
    name: lang:history.shop.log-icon-title
    lore:
    - lang:history.shop.log-icon-description-with-store-name
    custom-model-data: 0
  
  # 汇总图标
  summary:
    material: OAK_SIGN
    name: lang:history.shop.summary-icon-title
    lore:
    - lang:history.shop.summary-icon-description
    custom-model-data: 0
    slot: 0
  
  # 商店信息（单个商店）
  shop-info:
    material: PLAYER_HEAD
    lore:
    - lang:history.shop.header-icon-description
    custom-model-data: 0
    slot: 4
  
  # 多商店信息
  multi-shop-info:
    material: CHEST
    name: lang:history.shop.multi-shops-icon-title
    custom-model-data: 0
    slot: 4
  
  # 最佳顾客
  top-customers:
    material: DIAMOND
    name: lang:history.shop.top-n-valuable-customers-title
    lore:
    - lang:history.shop.top-n-valuable-customers-entry
    custom-model-data: 0
    slot: 8
  
  previous-page:
    material: ARROW
    name: lang:gui.shared.previous-page.display
    custom-model-data: 0
    slot: 3
  
  next-page:
    material: ARROW
    name: lang:gui.shared.next-page.display
    custom-model-data: 0
    slot: 5
  
  back:
    material: OAK_DOOR
    name: lang:gui.shared.back.display
    custom-model-data: 0
    slot: 49
  
  list-start-slot: 9

# ===================
# 浏览菜单（市场浏览）
# ===================
browse:
  title: lang:gui.browse.title
  rows: 6
  
  # 第 1 行在空槽位显示边框（按钮在其所在槽位覆盖边框）
  # 第 6 行是底部的分页/控制行
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    custom-model-data: 0
    rows:
    - 1
    - 6
  
  shop-item:
    lore:
    - lang:gui.browse.shop-item.lore
  
  # 搜索按钮 - 打开聊天输入框以搜索物品
  # {0} = 当前搜索关键词或 "None"
  search:
    material: ANVIL
    name: lang:gui.browse.search.display
    lore:
    - lang:gui.browse.search.lore
    custom-model-data: 0
    slot: 0
  
  # 排序按钮 - 循环切换排序选项
  # {0} = 当前排序方式
  sort:
    material: HOPPER
    name: lang:gui.browse.sort.display
    lore:
    - lang:gui.browse.sort.lore
    custom-model-data: 0
    slot: 2
  
  grouped-item:
    display: lang:gui.browse.grouped-item.display
  
  # 筛选按钮 - 循环切换筛选选项
  # {0} = 当前筛选条件
  filter:
    material: NAME_TAG
    name: lang:gui.browse.filter.display
    lore:
    - lang:gui.browse.filter.lore
    custom-model-data: 0
    slot: 4
  
  # 库存筛选开关 - 仅显示有可用库存/空间的商店
  # {0} = 开启或关闭
  stock-filter:
    material: CHEST
    name: lang:gui.browse.stock-filter.display
    lore:
    - lang:gui.browse.stock-filter.lore
    custom-model-data: 0
    slot: 6
  
  # 关闭按钮
  close:
    material: BARRIER
    name: lang:gui.shared.close.display
    custom-model-data: 0
    slot: 8
  
  # 返回按钮（用于商店列表页）
  back:
    material: OAK_DOOR
    name: lang:gui.shared.back.display
    custom-model-data: 0
    slot: 8
  
  # 分页控制（底部行）
  previous-page:
    material: ARROW
    name: lang:gui.shared.previous-page.display
    custom-model-data: 0
    slot: 48
  
  next-page:
    material: ARROW
    name: lang:gui.shared.next-page.display
    custom-model-data: 0
    slot: 50
  
  page-info:
    material: BOOK
    name: lang:gui.shared.page-info.display
    custom-model-data: 0
    slot: 49
  
  list-start-slot: 9

# ===================
# 共享图标
# ===================
shared:
  previous-page:
    material: ARROW
    name: lang:gui.shared.previous-page.display
    custom-model-data: 0
  
  next-page:
    material: ARROW
    name: lang:gui.shared.next-page.display
    custom-model-data: 0
  
  back:
    material: OAK_DOOR
    name: lang:gui.shared.back.display
    custom-model-data: 0
  
  close:
    material: BARRIER
    name: lang:gui.shared.close.display
    custom-model-data: 0
