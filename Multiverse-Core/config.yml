#                                                                                                  #
#    新选项会自动添加到本文件。如果你在服务器运行时手动修改过                                      #
#    本文件，请运行 `/mv reload` 命令。                                                           #
#                                                                                                  #
####################################################################################################
  
  
world:
  # 启用后，Multiverse 会自动导入 server.properties 中定义的默认世界
  # `level-name` 属性（当 Multiverse 启用或重载时）。这包括下界和 
  # 末地（如果服务器已创建它们）。
  auto-import-default-worlds: true
  
  # 启用后，Multiverse 会在启动或重载时导入其他插件创建的所有世界。
  # 或当 Multiverse 重载时。
  auto-import-3rd-party-worlds: true
  
  # 此设置会阻止玩家进入他们无权访问的世界。
  # 如果设为 false，玩家将可以进入任何世界。
  # 如果设为 true，玩家只能进入拥有
  # `mv.access.<worldname>` 权限的世界。
  enforce-access: false
  
  # 设置 Multiverse 是否在世界变更时强制执行游戏模式。
  # 启用后，玩家将被强制切换为所进入世界的游戏模式，除非他们拥有
  # `mv.bypass.gamemode.<worldname>` 权限。
  enforce-gamemode: true
  
  # 设置 Multiverse 是否在全球范围内强制执行飞行能力。
  # 如果你希望其他插件处理玩家的飞行能力，请禁用此选项。
  # 禁用此选项将使世界的 `allow-flight` 属性失效。
  enforce-flight: true
  
  # 设置 Multiverse 在世界变更后强制执行游戏模式和飞行能力的延迟（以 tick 为单位）。
  # 如果其他插件覆盖游戏模式或飞行能力导致问题，请增大此值。
  # 或设为 0 以在世界变更事件期间立即强制执行。
  gamemode-and-flight-enforce-delay: 1
  
  # 设置 Multiverse 是否应用 worlds.yml 中的实体 `tick-rate` 配置。
  # 禁用后，worlds.yml 中的 `tick-rate` 配置将被忽略。
  # 如果你希望 paper-world.yml 或其他插件按世界处理实体生成率，请禁用此选项。
  # !!!注意：此选项仅在服务器重启后生效！
  apply-entity-spawn-rate: true
  
  # 设置 Multiverse 是否在世界加载时应用实体的 `spawn-limit` 配置。
  # 禁用后，worlds.yml 中的 `spawn-limit` 配置将被忽略。
  # 如果你希望 paper-world.yml 或其他插件按世界处理实体数量限制，请禁用此选项。
  # !!!注意：此选项仅在服务器重启后生效！
  apply-entity-spawn-limit: true
  
  # 设置 Multiverse 是否在世界加载时根据世界的实体生成配置清除实体。
  auto-purge-entities: false
  
  # 用于 Multiverse 自动检测由主世界、下界和末地组成的世界组的世界名称格式。
  # 此选项用于 default-respawn-in-overworld 以及其他可能的功能。
  world-name-format:
    nether: '%overworld%_nether'
    end: '%overworld%_the_end'
  
  
teleport:
  # 设置 Multiverse 是否使用更细粒度的传送权限。
  # ----
  # /mvtp 和 /mvspawn 命令新增的更细粒度传送权限：
  #   - For specific teleport types: `multiverse.teleport.<self|other>.<type>.<target>`
  #   - For specific world spawn: `multiverse.core.spawn.<self|other>.<worldname>`
  # 例如，如果设置了 `multiverse.teleport.self.w.world2`，Multiverse 将只允许玩家传送到 world2。
  # ----
  # 如果设为 false，将使用旧版权限：
  #   - For teleport destinations: `multiverse.teleport.<self|other>.<type>`
  #   - For spawn: `multiverse.core.spawn.<self|other>`
  use-finer-teleport-permissions: true
  
  # 配置实体传送时乘客和载具的处理方式。此配置仅应用于
  # /mvtp、join-destination 和 first-spawn-override。它不会影响其他
  # 插件或命令进行的任何其他传送。
  # ========= 可用选项： =========
  #   default：服务器将处理乘客和载具。在 papermc 1.21.10+ 上，默认全部保留。
  #                                                        在旧版本上，如果世界变更，所有乘客和载具都会被卸载。
  #   dismount_passengers：乘客将在传送前从父实体上移除。
  #   dismount_vehicle：载具将在传送前从父实体上移除。
  #   dismount_all：所有乘客和载具将在传送前从父实体上移除。
  #   retain_passengers：乘客将随父实体一起传送。
  #   retain_vehicle：载具将随父实体一起传送。
  #   retain_all：所有乘客和载具将随父实体一起传送。
  passenger-mode: default
  
  # 设置使用 `/mv teleport` 命令一次最多允许传送的玩家数量
  concurrent-teleport-limit: 50
  
  # 如果设为 true，Multiverse 将对所有传送强制执行访问权限，
  # 包括来自其他插件的传送。除非你遇到与其他传送插件的
  # 冲突，否则不应禁用此选项。
  teleport-intercept: true
  
  # 设置寻找安全传送地点的水平（x 和 z 轴）搜索半径。
  # 增大此值会扩大搜索范围，但会牺牲性能。
  # 要禁用，请设为 0。
  safe-location-horizontal-search-radius: 3
  
  # 设置寻找安全传送地点的垂直（y 轴）搜索半径。
  # 增大此值会扩大搜索范围，但会牺牲性能。
  # 要禁用，请设为 0。
  safe-location-vertical-search-radius: 3
  
  
spawn:
  # 设置 Multiverse 是否覆盖玩家首次加入服务器时的出生位置。
  # 如需每次登录都使用固定的出生位置，请参阅下方的 `join-destination` 选项。
  # 如果禁用，将默认使用 server.properties 中的设置。
  first-spawn-override: false
  
  # 设置 Multiverse 用于玩家首次加入服务器时的位置所在世界。
  # 仅在 first-spawn-override 设为 true 时生效。
  first-spawn-location: ''
  
  # 启用后可为每次加入服务器的玩家设置固定出生位置。
  # 另请参阅下方的 `join-destination` 选项。
  enable-join-destination: false
  
  # 设置 Multiverse 用于每次登录时生成玩家的目的地。
  # 将上述 enable-join-destination 设为 false 以禁用
  join-destination: ''
  
  # 仅当玩家死亡所在世界未设置 `respawn-world` 属性，
  # 且玩家未设置床或重生锚时，此选项才生效。
  # ----
  # 启用此选项后，玩家在下界或末地死亡时将在主世界重生，模拟原版行为。
  # 主世界的自动选择由上方 `world-name-format` 配置部分决定。
  # 此选项优先于 `default-respawn-within-same-world` 选项。
  # ----
  # 如果你希望其他插件处理重生或不想要此原版行为，请设为 false。
  default-respawn-in-overworld: true
  
  # 仅当玩家死亡所在世界未设置 `respawn-world` 属性，
  # 且玩家未设置床或重生锚时，此选项才生效。
  # ----
  # 启用此选项后，玩家将在死亡时所在的同一世界重生。
  # 如果 /spawnpoint 已位于该世界内且 `enforce-respawn-at-world-spawn` 已禁用，
  # Multiverse 将使用该出生位置，否则将使用玩家死亡所在世界的出生点。
  # ----
  # 你可以使用命令设置 `respawn-world` 属性：`/mv modify <worldname> set respawn-world <worldname>`
  # 你可以使用命令重置 `respawn-world` 属性：`/mv modify <worldname> reset respawn-world`
  # ----
  # 如果你希望其他插件处理重生，请设为 false。
  default-respawn-within-same-world: true
  
  # 启用此选项后，玩家将始终在计算出的重生世界的出生位置重生，
  # 除非设置了床或重生锚，且分别启用了 `bed-respawn` 或 `anchor-spawn`。
  # ----
  # 如果你希望使用自定义出生位置（如 /spawnpoint）而不是世界出生位置，请设为 false。
  enforce-respawn-at-world-spawn: true
  
  
portal:
  # 此配置选项定义 Multiverse 是否干预 Bukkit 的默认传送门搜索半径。
  # 设为 false 表示你希望让 Bukkit 自行决定搜索半径。
  use-custom-portal-search: false
  
  # 此配置选项定义 Multiverse 搜索传送门时应使用的搜索半径。
  # 仅在 use-custom-portal-search 设为 true 时生效。
  custom-portal-search-radius: 128
  
  
messaging:
  # 此配置选项定义 Multiverse 是否在聊天消息前添加世界名称前缀。
  # 如果你希望其他插件处理聊天格式，请确保此项为 false。
  enable-chat-prefix: false
  
  # 此配置选项定义 Multiverse 在聊天消息前添加世界名称前缀时使用的格式。
  # 仅在 enable-chat-prefix 设为 true 时生效。
  chat-prefix-format: '[%world%]%chat%'
  
  # 此配置选项定义 Multiverse 是否注册 PlaceholderAPI 钩子。
  # 仅在安装了 PlaceholderAPI 时生效。
  register-papi-hook: true
  
  # 此配置选项定义 Multiverse 是否警告无效的 PlaceholderAPI 格式。
  # 仅在安装了 PlaceholderAPI 时生效，且仅针对 multiverse 占位符。
  warn-invalid-papi-format: true
  
  # 默认情况下，无效格式将返回原始的占位符字符串。
  # 此配置选项定义 Multiverse 是否将无效的 PlaceholderAPI 格式显示为空白。
  # 仅在安装了 PlaceholderAPI 时生效，且仅针对 multiverse 占位符。
  invalid-papi-format-returns-blank: false
  
  # 此配置选项定义 Multiverse 应使用的默认语言。
  default-locale: en
  
  # 此配置选项定义 Multiverse 是否根据玩家客户端的语言使用玩家的语言。
  # 如果玩家的语言没有翻译，将改用上方设置的默认语言。
  per-player-locale: true
  
  
command:
  # 如果设为 true，Multiverse 将根据世界的别名来解析命令和目的地。
  # 常规世界名称仍然有效。
  # 如果有多个世界使用相同的别名，将使用最先找到的世界。
  resolve-alias-name: true
  
  # 如果设为 true，Multiverse 在 Tab 补全中只会提示简单的目的地格式。
  # 这意味着只会提示世界名称，而不会提示 `e:worldname:x,y,z` 或 `p:playername` 等其他目的地类型。
  # 注意：这并不会阻止玩家使用这些目的地，因为这由权限控制。
  simplified-destination-tab-completion: false
  
  # 此配置选项定义执行危险操作前是否需要 `/mv confirm`。
  #   enable：需要 `/mv confirm`。
  #   player_only：仅当以玩家身份运行命令时才需要 `/mv confirm`。
  #   disable_command_blocks：命令方块不需要 `/mv confirm`。
  #   disable_console：控制台不需要 `/mv confirm`。
  #   disable：不需要 `/mv confirm`。
  confirm-mode: enable
  
  # 如果设为 true，`/mv confirm` 将包含一个必须输入的 3 位随机数来确认命令。
  # 例如：`/mv confirm 726`
  use-confirm-otp: true
  
  # `/mv confirm` 超时前等待的秒数
  confirm-timeout: 30
  
  # 如果设为 true，Tab 补全中将显示旧版别名。
  # 这些是旧的 mv4 别名，例如 `/mvclone` 以及 `/mv clone`，会使 Tab 补全显得拥挤。
  # !!!注意：此选项仅在服务器重启后生效！
  show-legacy-aliases: false
  
  
event-priority:
  # 以下配置会更改某些事件的 Bukkit EventPriority。
  # 仅当你需要 multiverse 的事件结果覆盖其他插件，或
  # 希望其他插件的结果覆盖 multiverse 时，才更改此配置。
  # ----
  # !!!注意：此选项仅在服务器重启后生效！
  
  # 此配置选项定义 PlayerPortalEvent 的优先级。
  player-portal: high
  
  # 此配置选项定义 PlayerRespawnEvent 的优先级。
  player-respawn: low
  
  # 此配置选项定义 PlayerSpawnLocationEvent 的优先级。
  player-spawn-location: normal
  
  # 此配置选项定义 PlayerTeleportEvent 的优先级。
  player-teleport: highest
  
  # 此配置选项定义 PlayerChangedWorldEvent 的优先级。
  player-changed-world: normal
  
  
misc:
  # 如果你使用 `--bukkit-settings` 启动参数为 bukkit.yml 指定了自定义路径，请更改此项。
  # 注意：此配置选项需要重启服务器才能生效。
  bukkit-yml-path: bukkit.yml
  
  # 如果你使用 `--config` 启动参数为 server.properties 指定了自定义路径，请更改此项。
  # 注意：此配置选项需要重启服务器才能生效。
  server-properties-path: server.properties
  
  # 启用后，Multiverse 将尝试自动检测服务器上安装的世界生成器插件。
  # 此选项仅影响 `/mv create` 命令中的 Tab 补全和 `/mv generators` 命令的输出。
  # 禁用此选项不会影响世界生成器插件本身的使用。
  auto-detect-generator-plugins: true
  
  # 这是用于帮助排查 Multiverse 问题的调试标志。
  # 如果你在使用 Multiverse 时遇到问题，请将其设为 3，然后将日志发布到 pastebin.com
  # 否则无需更改此项，除非有 wiki 页面或开发者的指示。
  #   0 = 关闭，无调试消息
  #   1 = 细致
  #   2 = 更细致
  #   3 = 最细致
  global-debug: 0
  
  # 设置控制台是否记录所有 multiverse 插件执行的每次权限检查。
  # 仅当上述 'global-debug' 设为 1 或更高时才会生效。
  debug-permissions: false
  
  # 如果为 true，将不再显示启动控制台消息。
  silent-start: false
  
  # 如果你不想赞助，可以将此设为 false，Multiverse 将不再提醒你。
  # 但如果你想赞助，这里是我们的 Github Sponsors 页面：https://github.com/sponsors/Multiverse
  show-donation-message: true
  
  
# 这仅表示版本号，以便我们查看你所使用的配置版本。
# 切勿修改此值
version: 5.2
