Simplified-Chinese:
    #所有消息均可自定义，部分消息可根据其对应的功能使用一些功能自带的占位符。（详见官方Wiki）
    #若需要禁用掉某一消息的提示，可将其设置为"[]"，例: Player-Only: 'xxx' 改为 Player-Only: [] 即可。
    #所有消息均可使用多行提示，只需要根据YAML格式将单行消息改成多行消息即可。
    #若想在消息提示的同时使插件做出额外的行为操作，可以参考官方Wiki中的“消息元件”一栏的详细说明。
    Language-Name: '简体中文'
    No-Permission: '{prefix}&c你没有这么做的权限!'
    Player-Only: '{prefix}&c控制台不能使用这个命令.'
    Player-Not-Exist: '{prefix}&c玩家 &e{player} &c不存在！'
    Not-A-Number: '{prefix}&c参数 &e{number} &c不是一个&l有效的&c数字， 请检查你的命令参数或数字是否符合操作执行的&l需求&c！'
    Not-An-Integer-Number: '{prefix}&c参数 &e{number} &c不是一个&l整数&c， 请检查你的命令参数或数字是否符合操作执行的&l需求&c！'
