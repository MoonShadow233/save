        ACCORDING_TO_PRICE: 根据商品价格（贵的在前）
        ACCORDING_TO_ITEM_AMOUNT: 根据商品的数量（多的在前）
        RANDOM: 随机排列
    Item-Mail-Sort:
        ACCORDING_TO_THE_STATE: 根据状态排列（顺序：正常->已签收->已过期）
