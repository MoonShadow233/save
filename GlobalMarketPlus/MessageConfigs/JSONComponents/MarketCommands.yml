    'Market Edit':
        Placeholder: '%gmp_command_market_edit%'
        Text: '&6&l[点击编辑]'
        ClickEvent:
            Action: RUN_COMMAND
            Value: '/gmp merchandise gui {uid}'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&5点击编辑编号为 &e{uid} &5的商品'
    'Market Transaction':
        Placeholder: '%gmp_command_market_transaction%'
