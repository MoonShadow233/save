Simplified-Chinese:
    'Market Help':
        Placeholder: '%gmp_command_market_help%'
        Text: '&2help'
        ClickEvent:
            Action: RUN_COMMAND
            Value: '/gmp market help '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b关于 &c/gmp &6market &b的命令帮助'
    'Market GUI':
        Placeholder: '%gmp_command_market_gui%'
        Text: '&2gui &7[商品类型] [页数]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp market gui '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b打开全球市场主界面'
            - '&b使用方法 &c/gmp &6market gui &7[商品类型] [页数]'
    'Market Sell':
        Placeholder: '%gmp_command_market_sell%'
        Text: '&2sell [价格] &7[数量]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp market sell '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b上架手中的物品'
            - '&b使用方法 &c/gmp &6market sell [价格] &7[数量]'
    'Market Buy':
        Placeholder: '%gmp_command_market_buy%'
        Text: '&2buy [定金] &7[数量]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp market buy '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b以手中物品为根据发起同款物品的收购'
            - '&b使用方法 &c/gmp &6market buy hand [定金] &7[数量]'
    'Market Search':
        Placeholder: '%gmp_command_market_search%'
        Text: '&2search [参数]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp market search '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b以特定的参数搜索商品'
            - '&b使用方法 &c/gmp &6market search [参数]'
    'Market Search Player':
        Placeholder: '%gmp_command_market_search_player%'
        Text: '&2player:[玩家名字]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp market search player:'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b商家的名字'
    'Market Search Item':
        Placeholder: '%gmp_command_market_search_item%'
        Text: '&2item:[物品ID]'
