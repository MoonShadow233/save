Simplified-Chinese:
    'Auction Help':
        Placeholder: '%gmp_command_auction_help%'
        Text: '&2help'
        ClickEvent:
            Action: RUN_COMMAND
            Value: '/gmp auction help '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b关于 &c/gmp &6auction &b的命令帮助'
    'Auction Start':
        Placeholder: '%gmp_command_auction_start%'
        Text: '&2start [起拍价] &7[数量]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp auction start '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b发起新的商品拍卖'
            - '&b使用方法 &c/gmp &6auction &2start [起拍价] &7[数量]'
