Simplified-Chinese:
    'Merchandise Help':
        Placeholder: '%gmp_command_merchandise_help%'
        Text: '&2help'
        ClickEvent:
            Action: RUN_COMMAND
            Value: '/gmp merchandise help'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b关于 &c/gmp &6merchandise &b的命令帮助'
    'Merchandise Set':
        Placeholder: '%gmp_command_merchandise_set%'
        Text: '&2set [商品UID] '
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp merchandise set '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b设置一件商品的属性'
            - '&b使用方法 &c/gmp &6merchandise set [商品UID]'
