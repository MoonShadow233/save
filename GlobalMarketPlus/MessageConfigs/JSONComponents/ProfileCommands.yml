Simplified-Chinese:
    #GUI信息提示
    'GUI SetStoreName':
        Placeholder: '%gmp_gui_profile_storename%'
        Text: '&b&l&n[点击这里设置商店名字]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp profile set storeName '
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b使用方法 &c/gmp &6profile set storeName [名字]'
    'GUI SetStoreDescription':
        Placeholder: '%gmp_gui_profile_storedescription%'
        Text: '&b&l&n[点击这里设置商店简介]'
        ClickEvent:
            Action: RUN_COMMAND
            Value: '/gmp profile set storeDescription help'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b使用方法 &c/gmp &6profile set storeDescription'
    #命令
    'Profile Help':
        Placeholder: '%gmp_command_profile_help%'
        Text: '&2help'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp profile help'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b关于 &c/gmp &6profile &b的命令帮助'
    'Profile Set':
        Placeholder: '%gmp_command_profile_set%'
        Text: '&2set'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp profile set'
        HoverEvent:
            Action: SHOW_TEXT
            Hover-Values: 
            - '&b编辑商家档案'
            - '&b使用方法 &c/gmp &6profile set '
    'Profile Set hideMerchandises':
        Placeholder: '%gmp_command_profile_set_hidemerchandises%'
        Text: '&2hideMerchandises [true/false/switch]'
        ClickEvent:
            Action: SUGGEST_COMMAND
            Value: '/gmp profile set hideMerchandises '
