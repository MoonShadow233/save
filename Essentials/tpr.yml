# 随机传送（random teleport）命令的配置。
# 在游戏内使用 /settpr 命令设置随机传送位置。

default-location: '{world}'
excluded-biomes:
- cold_ocean
- deep_cold_ocean
- deep_frozen_ocean
- deep_lukewarm_ocean
- deep_ocean
- deep_warm_ocean
- frozen_ocean
- frozen_river
- lukewarm_ocean
- ocean
- river
- warm_ocean
locations:
  world:
    center:
      world: 09be0b0d-73f1-4ec1-8b4f-106e18d86e8e
      world-name: world
      x: 0.0
      y: 63.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
