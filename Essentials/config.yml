  - worth
  - xmpp

# 使用此选项可强制使用基于 superperms 的权限处理器，而无论检测到已安装的哪个权限插件。
# 如果你希望自定义权限插件使用基于 superperms 的权限（支持通配符），此选项会很有用。
# 如果你想使用 Essentials 通过上面 'player-commands' 部分提供的内置权限，请将此设为 false。
use-bukkit-permissions: true

# 启用此选项后，一次性使用的礼包（即 delay < 0）将从
# '/kit list' 中移除，当玩家不再能使用它们时。
skip-used-one-time-kits-from-kit-list: false

# 启用后，只要玩家的盔甲栏为空，来自礼包的盔甲将自动装备。
kit-auto-equip: false

# 决定 /createkit 命令的功能。
# 如果为 true，/createkit 将向用户提供带有礼包代码的链接。
# 如果为 false，/createkit 将直接把礼包添加到 'kits.yml' 配置文件中。
pastebin-createkit: false

# 决定 /createkit 是否使用 NBT 物品序列化来生成礼包。
# 如果为 true，/createkit 将以 NBT 格式存储物品。否则，它将使用 Essentials 的人类可读物品格式。
# 通过使用 NBT 序列化，/createkit 可以存储具有复杂元数据的物品，例如潜影盒和带自定义属性的武器。
# 警告：此选项仅在 1.15.2+ 的 Paper 服务器上有效，并且会绕过其他插件（如 Magic）的任何自定义序列化器。
# 警告：启用此选项并通过 /createkit 创建礼包后，你将无法使用这些礼包物品降级你的服务器。
# 此选项只影响 /createkit - 你仍然可以使用 Essentials 的人类可读物品格式在 'kits.yml' 中手动创建礼包。
use-nbt-serialization-in-createkit: false

# 要启用告示牌，请移除 # 符号。要禁用所有告示牌，请注释掉或移除每个告示牌。
# 有关如何使用这些告示牌的说明，请参阅 https://wiki.ess3.net/wiki/Sign_Tutorial
# 当任何告示牌类型被启用时，Essentials 的彩色告示牌支持将同时启用。
# 注意：'color' 并不是真正的告示牌类型；它是在给予相应权限时允许在告示牌上使用颜色代码。
enabledSigns:
  #- color
  #- balance
  #- buy
  #- free
  #- sell
  #- trade
  #- enchant
  #- repair
  #- gamemode
  #- heal
  #- info
  #- kit
  #- mail
  #- randomteleport
  #- warp
  #- anvil
  #- cartography
  #- disposal
  #- grindstone
  #- loom
  #- smithing
  #- workbench
  #- spawnmob
  #- time
  #- weather

# 这定义了每位玩家每秒可以与 Essentials 告示牌交互的次数。
# 值应在 1-20 之间，设为 20 时几乎不提供卡顿防护。
# 较低的数字将降低卡顿的可能性，但可能会让玩家感到不便。
sign-use-per-second: 4

# 允许在 1.13 及以上版本的旧告示牌上使用物品 ID。
# 你不能在新告示牌上使用物品 ID，但此项将允许玩家与那些
# 在 1.13 之前放置的告示牌进行交互。
allow-old-id-signs: false

# Essentials 不应保护的告示牌名称列表。当另一个插件提供的告示牌与 Essentials 提供的相同、但
# Essentials 会覆盖它时，此功能尤其有用。
# 例如，如果某个插件提供 [kit] 告示牌，并且你希望使用它的而不是
# Essentials 的，只需在下面添加 'kit'，Essentials 就不会保护它。
#
# 更多信息请参阅 https://github.com/drtshock/Essentials/pull/699
unprotected-sign-names:
  #- kit

# 备份功能会在指定时间间隔内运行自定义的 batch/bash 命令。
# 服务器会在执行备份命令前保存世界，并在备份期间禁用
# 保存以防止世界损坏或其他冲突。
# 也可以使用 /backup 手动触发备份。
backup:
  # 间隔时间（分钟）。
  interval: 30
  # 如果为 true，即使没有玩家在线，备份任务也会运行。
  always-run: false
  # 除非你在此添加有效的备份命令或脚本，否则此功能将毫无用处。
  # 下面的示例命令使用了 rdiff-backup：https://rdiff-backup.net
  #command: 'rdiff-backup World1 backups/World1'

# 将此设为 true 以启用按地标（warp）分配权限。
per-warp-permission: false

# 按分组对 /list 命令的输出进行排序。
# 你可以通过在此定义所需的行为来隐藏和合并 /list 中显示的组。
# 详细说明和示例可在 wiki 上找到：https://wiki.ess3.net/wiki/List
list:
    # 要在 /list 中将多个组合并到一个名称下，请将每个组按空格分隔写在一行。
    #Staff: owner admin moderator
    Admins: owner admin
    # 要截断组列表，请设置最大玩家数量限制。
    #builder: 20
    # 要隐藏组，请将组设置为 hidden。
    #default: hidden
    # 取消注释下面这行，即可简单地列出所有玩家而不进行分组。
    #Players: '*'

# 在 /list 中显示使用昵称的玩家的真实名称。
real-names-on-list: false

# 向控制台输出更多信息。
debug: false

# 设置所有消息的语言区域（locale）。
# 如果你不设置此项，将使用服务器的默认语言区域。
# 例如，要将语言设置为英语，请将 locale 设为 'en'。然后它将使用 'messages_en.properties' 文件。
# 别忘了移除该行前面的 #。
# 更多信息请访问 https://essentialsx.net/wiki/Locale.html
#locale: en

# 发送消息时，Essentials 是否应使用玩家的语言而不是服务器的语言？
# 如果你想让服务器使用的语言与玩家使用的语言不同，此选项会很有用。
# 例如，如果你的服务器设置为英语而某位玩家说法语，你可以将此设为 true。
# 然后 Essentials 将向该玩家发送法语消息，而控制台中的消息将保持英语。
# 如果不知道玩家的语言，将使用服务器的语言（或上面定义的语言）。
per-player-locale: false

# 更改 Essentials 消息中使用的默认主色和辅色。
# 某些消息可能使用自定义颜色，这些颜色必须在相应的消息文件中编辑。
# 有关自定义消息的更多信息，请参阅 https://essentialsx.net/wiki/Locale.html
message-colors:
  primary: '#ffaa00'
  secondary: '#ff5555'

# 当玩家离开服务器时关闭上帝模式。
remove-god-on-disconnect: false

# 在此超时时间（秒）之后，玩家将被设置为 AFK 状态。
# 此功能要求玩家拥有 'essentials.afk.auto' 权限。
# 设为 -1 表示无超时。
auto-afk: 300

# 在此超时时间（秒）之后，玩家将被踢出服务器，或者执行
# 'afk-timeout-commands' 中的命令。
# 'essentials.afk.kickexempt' 权限可以覆盖此功能。
# 设为 -1 表示无超时。
auto-afk-timeout: -1

# 一旦达到上面 'afk-auto-timeout' 中定义的阈值，将执行此命令列表，而不是踢出玩家。
# 如果此列表为空且 'afk-auto-timeout' 未设为 -1，
# Essentials 将默认在玩家达到超时阈值时
# 将其踢出服务器。
#
# 警告：你必须在此包含一个能将玩家移出服务器
# 或使其停止 AFK 的命令。否则，这些命令将每秒运行一次，
# 直到玩家不再处于 AFK 状态！
#
# 可用占位符：
# {USERNAME} - 玩家的用户名。
# {KICKTIME} - 玩家已处于 AFK 状态的时间（分钟）。
afk-timeout-commands:
  #- eco take {USERNAME} 10
  #- kick {USERNAME} You have been kicked for being inactive for {KICKTIME} minutes! You lost $10.

# 如果你希望在玩家 AFK 时将其冻结，请将此设为 true。
# 其他玩家或怪物将无法将他们推出 AFK 状态。
# 这还将为 AFK 玩家启用临时的上帝模式。
# 玩家必须使用 /afk 命令才能离开 AFK 状态。
freeze-afk-players: false

# 当玩家处于 AFK 状态时，他们是否能够拾取物品？
# 如果你想防止玩家在生物陷阱中挂机，请启用此项。
disable-item-pickup-while-afk: false

# 此设置控制玩家在交互时是否被标记为活跃。
cancel-afk-on-interact: true

# 当玩家移动时，Essentials 是否应自动移除 AFK 状态？
# 无论此设置如何，玩家在聊天或使用命令时都会退出 AFK 状态。
# 禁用以减少服务器卡顿。
cancel-afk-on-move: true

# 当玩家发送聊天消息时，Essentials 是否应自动移除 AFK 状态？
cancel-afk-on-chat: true

# 当玩家使用钓鱼竿时，Essentials 是否应自动移除 AFK 状态？
cancel-afk-on-fish: true

# 当其他玩家尝试睡觉时，是否应忽略 AFK 玩家？
# 当此设置为 false 时，如果有些玩家处于 AFK 状态，其他玩家将无法跳过夜晚。
# 拥有 'essentials.sleepingignored' 权限的玩家将始终被忽略。
sleep-ignores-afk-players: true

# 当其他玩家尝试睡觉时，是否应忽略隐身玩家？
# 当此设置为 false 时，如果隐身玩家没有睡觉，其他玩家将无法跳过夜晚。
# 拥有 'essentials.sleepingignored' 权限的玩家将始终被忽略。
sleep-ignores-vanished-player: true

# 更改玩家处于 AFK 状态时在 /list 中的名称。默认值为 none，这表示 Essentials
# 不应干预 AFK 玩家在 /list 中的名称。
# 你可以使用颜色代码、{USERNAME}（玩家的名称）或 {PLAYER}（玩家的显示名称）。
afk-list-name: "none"

# 当玩家进入或退出 AFK 状态时，AFK 通知是应向整个服务器广播，
# 还是只通知玩家本人？
# 当此设置为 false 时，玩家更改 AFK 状态时只会通知玩家本人。
broadcast-afk-message: true

# 你可以在此禁用 Minecraft 的死亡消息。
death-messages: true

# Essentials 应如何处理拥有 'essentials.keepinv' 权限、且物品带有
# 消失诅咒的玩家死亡时？
# 有效选项为：'keep'、'drop' 和 'delete'。
vanishing-items-policy: keep

# Essentials 应如何处理拥有 'essentials.keepinv' 权限、且物品带有
# 绑定诅咒的玩家死亡时？
# 有效选项为：'keep'、'drop' 和 'delete'。
binding-items-policy: keep

# 当玩家死亡时，他们是否应收到死亡地点的坐标？
send-info-after-death: false

# 拥有权限的玩家是否能够静默加入和退出？
# 如果启用，你可以通过 'essentials.silentjoin' 和 'essentials.silentquit' 权限来控制这一点。
# 此外，拥有 'essentials.silentjoin.vanish' 权限的玩家在加入时将被隐身。
allow-silent-join-quit: false

# 你可以在此设置自定义的加入和退出消息。将其设为 "none" 以使用 Minecraft 默认消息，
# 或设为 "" 以完全隐藏该消息。
#
# 可用占位符：
# {PLAYER} - 玩家的显示名称。
# {USERNAME} - 玩家的用户名。
# {PREFIX} - 玩家的前缀。
# {SUFFIX} - 玩家的后缀。
# {ONLINE} - 在线玩家数量。
# {UNIQUE} - 加入过服务器的独立玩家数量。
# {UPTIME} - 服务器已在线运行的时间。
custom-join-message: "none"
custom-quit-message: "none"

# 你可以在此为使用新用户名加入的玩家设置自定义加入消息。
# 仅当玩家之前加入过且之后更改了用户名时，才会使用此消息。
# 此消息将代替上面的 'custom-join-message' 显示，因此如果你希望它们相似，请确保两者一致。
# 将其设为 "none" 以在每次加入时都使用 'custom-join-message' 设置。
#
# 可用占位符：
# {PLAYER} - 玩家的显示名称。
# {USERNAME} - 玩家的用户名。
# {OLDUSERNAME} - 玩家的旧用户名。
# {PREFIX} - 玩家的前缀。
# {SUFFIX} - 玩家的后缀。
# {ONLINE} - 在线玩家数量。
# {UNIQUE} - 加入过服务器的独立玩家数量。
# {UPTIME} - 服务器已在线运行的时间。
custom-new-username-message: "none"

# Essentials 是否应使用语言文件中的消息覆盖原版的"服务器已满"消息？
# 设为 false 以保留原版消息。
use-custom-server-full-message: true

# Essentials 是否应使用语言文件中的消息覆盖原版的"你不在本服务器的白名单中"消息？
# 设为 false 以保留原版消息。
use-custom-whitelist-message: true

# 当玩家数量达到一定限制时，你可以禁用加入和退出消息。
# 当玩家数量低于此数字时，加入/退出消息将始终显示。
# 将此设为 -1 可始终显示加入和退出消息，无论玩家数量如何。
hide-join-quit-messages-above: -1

# 如果你想在某个世界中自动禁用上帝模式，请将该世界添加到此列表。
no-god-in-worlds:
  #- world_nether

# 设为 true 以启用按世界分配权限，用于通过 Essentials 命令在世界之间传送。
# 这适用于 /world、/back、/tp[a|o|here|all]，但不适用于地标（warp）。
# 通过 'essentials.worlds.<worldname>' 权限授予某人传送到某个世界的权限。
# 这不影响 /home 命令；请使用下面的 'world-home-permissions'。
world-teleport-permissions: false

# 在 /item 或 /give 中省略数量参数时给予的物品数量。
# 如果此数字低于 1，则给予最大堆叠数量。如果下面的 'oversized-stacksize' 未更改，
# 任何高于最大堆叠数量的数字都会产生多个堆叠。
default-stack-size: -1

# 超大堆叠是忽略正常最大堆叠数量的堆叠。
# 如果玩家拥有 'essentials.oversizedstacks' 权限，可以通过 /give 和 /item 获得它们。
# 一个超大堆叠中应包含多少物品？
oversized-stacksize: 64

# 允许修复附魔的武器和盔甲。
# 如果将此设为 false，你仍然可以通过 'essentials.repair.enchanted' 权限
# 允许特定玩家进行修复。
repair-enchanted: true

# 允许在礼包和物品生成中使用"不安全"的附魔。
# 警告：混用某些附魔并使其等级过高可能会导致客户端、服务器和插件出现问题。
unsafe-enchantments: false

# /tree 和 /bigtree 命令可以在距玩家多少格（方块）的范围内生成树木的最大距离。
tree-command-range-limit: 300

# Essentials 是否应在传送监听器中跟踪玩家之前的位置供 /back 使用？
# 如果将此设为 true，任何使用传送的插件都将记录之前的位置。
register-back-in-listener: false

# 玩家登录后多少秒内不能造成攻击伤害。
# 这可以防止玩家利用他们加入时获得的临时无敌状态。
login-attack-delay: 5

# 将最大行走和飞行速度设置为 0.1 到 1.0 之间的任意值。
# 注意：这些值是相对于游戏内速度等级（0 到 10）的比例。
# 例如，如果最大速度设为 0.8，玩家使用 '/speed 10'，他们的实际速度将为 0.8。
max-walk-speed: 0.8
max-fly-speed: 0.8

# 设置一分钟内可以发送的最大邮件数量。
mails-per-minute: 1000

# 设置 /mute 可以应用的最大时长（秒）。
# 设为 -1 可禁用限制。拥有 'essentials.mute.unlimited' 权限的玩家可以绕过此限制。
max-mute-time: -1

# 设置 /tempban 可以应用的最大时长（秒）。
# 设为 -1 可禁用限制。拥有 'essentials.tempban.unlimited' 权限的玩家可以绕过此限制。
max-tempban-time: -1

# 更改默认的 /reply 功能。可以使用 /rtoggle 针对每个玩家单独更改。
# 如果为 true，/r 将回复你最后发过消息的人，否则回复第一个给你发消息的人。
# 如果为 false，/r 将回复最后一个给你发消息的人。
last-message-reply-recipient: true

# 如果为某个玩家启用了 'last-message-reply-recipient'，
# 此设置指定收到消息后需要经过的秒数，
# 之后回复对象才会更新。
# 180 秒 = 3 分钟
last-message-reply-recipient-timeout: 180

# 更改默认的 /reply 功能。
# 如果为 true，/reply 将不检查你正在回复的人是否处于隐身状态。
# 如果为 false，玩家将无法 /reply 回复他们看不到的隐身玩家。
last-message-reply-vanished: false

# 切换是否用牛奶桶左击生物可将其变成幼年形态。
milk-bucket-easter-egg: true

# 切换是否在玩家加入时向其发送飞行状态消息。
send-fly-enable-on-join: true

# 设为 true 以启用按世界分配权限，用于通过 Essentials 命令设置各个世界的时间。
# 这适用于 /time、/day 和 /night 命令。
# 通过 'essentials.time.world.<worldname>' 权限授予某人设置某个世界时间的权限。
world-time-permissions: false

# 为 Essentials 命令和外部命令指定冷却时间。
# 命令不以正斜杠 (/) 开头。例如，不要写 '/msg'，而是写 'msg'。
#
# 支持通配符。例如，
# - '*i*': 50
# 会给所有包含字母 "i" 的命令添加 50 秒的冷却时间。
#
# Essentials 支持通过以脱字符 (^) 开头来使用正则表达式。
# 例如，要匹配以 "ban" 开头但不匹配 "banip" 的命令，请使用：
#  '^ban([^ip])( .*)?': 60 # /ban 命令 60 秒冷却
# 注意：如果你的命令以 ^ 开头，请使用反斜杠 (\) 转义。例如：\^command: 123
command-cooldowns:
  #feed: 100 # 100-second cooldown on /feed command
  #'*': 5 # 所有命令 5 秒冷却

# 命令冷却时间是否应在服务器关闭后仍然保留。
command-cooldown-persistence: true

# NPC 的余额是否应包含在 /balancetop 等余额排名功能中。
# NPC 的余额可能包含来自 FactionsUUID 插件等功能的派系余额。
npcs-in-balance-ranking: false

# 允许玩家潜行时通过告示牌进行批量购买和出售。
# 当告示牌一次只购买或出售一件物品，而玩家想一次出售多件时，此选项很有用。
allow-bulk-buy-sell: true

# 允许使用 /sell 命令出售带有自定义名称的物品。
# 这有助于防止玩家意外出售已命名的物品。
allow-selling-named-items: false

# 玩家加入时显示 MOTD 的延迟时间（毫秒）。
# 如果 MOTD 命令或权限被禁用，此设置无效。
# 设为 -1 可完全禁用加入时的 MOTD。
delay-motd: 0

# 默认启用配套确认命令的命令列表。
# 默认为空。有关有效命令的最新列表，请参阅最新的 'config.yml' 源文件。
default-enabled-confirm-commands:
  #- pay
  #- clearinventory

# 玩家从监狱释放时，Essentials 应将他们传送到哪里？
# 设为 'back' 可将其传送到入狱前的位置，
# 设为 'spawn' 可将其送到出生点，或设为 'off' 以在释放时不进行传送。
teleport-when-freed: back

# 监禁时间是否只应在玩家在线时计算。
# 如果为 true，被监禁玩家的时间只会在其在线时递减。
jail-online-time: false

# 设置玩家接受传送请求的超时时间（秒），超时后请求将被取消。
# 设为 0 表示无超时。
tpa-accept-cancellation: 120

# 任何玩家可以同时挂起的传送请求的最大数量。
# 超过此阈值后，旧的请求将立即超时。
tpa-max-requests: 5

# 允许玩家通过用物品点击头盔栏来设置帽子。
allow-direct-hat: true

# 允许游戏内玩家在运行 /broadcastworld 时指定世界。
# 如果为 false，在游戏内运行 /broadcastworld 将始终向玩家当前所在的世界发送消息。
# 这不影响从控制台运行该命令，从控制台运行时始终需要指定世界。
allow-world-in-broadcastworld: true

# usermap 是否应在保存用户名之前尝试对其进行检查清理？
# 只有在你使用中国版 Minecraft 时才应将其改为 false。
safe-usermap-names: true

# 当命令方块执行命令时，Essentials 是否应输出日志？
# Example: CommandBlock at <x>,<y>,<z> issued server command: /<command>
log-command-block-commands: true

# 当控制台执行命令时，Essentials 是否应输出日志？
# Example: CONSOLE issued server command: /<command>
log-console-commands: true

# 设置使用 /fireball 生成的弹射物的最大速度。
max-projectile-speed: 8

# 设置用户可以使用 /itemlore 命令设置的最大描述（lore）行数。
# 拥有 'essentials.itemlore.bypass' 权限的玩家将能够绕过此限制。
max-itemlore-lines: 10

# Essentials 是否应检查更新？
# 如果设为 true，Essentials 将在有新版本可用时显示通知。
# 这使用公开的 GitHub API，不会发送或存储任何身份识别信息。
update-check: true

############################################################
# +------------------------------------------------------+ #
# |                          家                          | #
# +------------------------------------------------------+ #
############################################################

# 允许玩家在白天设置他们的床。
# 此设置在 Minecraft 1.15+ 中无效，因为 Minecraft 始终允许玩家在白天设置床的位置。
update-bed-at-daytime: true

# 设为 true 以启用按世界分配权限，用于通过家在世界之间传送。
# 这仅适用于 /home 命令。
# 通过 'essentials.worlds.<worldname>' 权限授予某人传送到某个世界的权限。
world-home-permissions: false

# 允许玩家拥有多个家。
# 玩家需要 'essentials.sethome.multiple' 权限才能拥有 1 个以上的家。
# 你可以使用下面的 'default' 等级来设置多个家的默认数量。
# 要完全移除家的数量限制，请授予 'essentials.sethome.multiple.unlimited' 权限。
#
# 要向不同的人授予不同的家的数量，你需要在下面定义一个"家等级"（home rank）。
# 创建后，授予相应的权限：'essentials.sethome.multiple.<home_rank>'。
# 注意：下面定义的"家等级"不需要与你的权限插件的组名匹配。
#
# 在此示例中，拥有 'essentials.sethome.multiple' 和 'essentials.sethome.multiple.vip' 权限的人将拥有 5 个家。
# 请记住，他们必须同时拥有这两个权限节点才能设置多个家。
# 更多信息请访问 https://wiki.ess3.net/wiki/Multihome
sethome-multiple:
  default: 3
  vip: 5
  staff: 10

# 控制玩家是否需要 'essentials.home.compass' 权限才能将指南针
# 指向他们的第一个家。
# 保持为 false 将保留 Essentials 的原始行为，即始终
# 将指南针的方向改为指向玩家的第一个家。
compass-towards-home-perm: false

# 如果玩家未设置家，是否希望将他们传送到出生点？
# 如果设为 false，玩家在未先设置家的情况下运行 /home 时将不会被传送。
spawn-if-no-home: true

# 是否应要求玩家对尝试覆盖的家进行确认？
confirm-home-overwrite: false

############################################################
# +------------------------------------------------------+ #
# |                          经济                         | #
# +------------------------------------------------------+ #
############################################################

# 更多信息请访问 https://wiki.ess3.net/wiki/Essentials_Economy

# 你可以通过使用 /setworth 命令和 'worth.yml' 来控制出售给服务器的物品的价值。

# 定义新玩家开始时的余额。
starting-balance: 0

# 定义使用给定命令的每次费用（PER USE）。
# 某些命令（如 /repair）有子费用。更多信息请查看 wiki。
command-costs:
  # 要使 /example 每次使用费用为 $1000：
  #example: 1000
  # 要使 '/kit tools' 每次使用费用为 $1500：
  #kit-tools: 1500

# 将其设置为你想使用的货币符号。
# 请记住，如果你想在本文件中使用特殊字符（如带重音的字母），
# 你必须将文件保存为 UTF-8 编码，而不是 ANSI。
currency-symbol: '$'

# 启用此选项可使货币符号出现在金额末尾而不是开头。
# 例如，欧元符号通常出现在金额之后。
currency-symbol-suffix: false

# 设置玩家可以拥有的最大金额。
# 注意：极大的数字可能会产生意想不到的后果。
max-money: 10000000000000

# 设置玩家可以拥有的最小金额（必须大于 max-money 的负值）。
# 将其设为 0 将完全禁用透支/借贷。
# 玩家需要 'essentials.eco.loan' 权限才能拥有负余额。
min-money: -10000

# 启用此项以记录与购买/出售/交易告示牌及 sell 命令的所有交互。
economy-log-enabled: false

# 启用此项可在 trade.log 文件中用 UUID 替换用户名。
# 如果为 false，将使用用户名而不是 UUID。
economy-log-uuids: false

# 启用此项还可记录来自其他插件通过 Vault 进行的所有交易。
# 这可能导致经济日志很快写满，因此只应在测试目的下启用！
economy-log-update-enabled: false

# /pay 中可接受的最小金额。
minimum-pay-amount: 0.001

# 启用此项可阻止玩家 /pay 那些屏蔽了他们的人。
pay-excludes-ignore-list: false

# 余额为 $0 或更低的玩家是否应显示在余额排行榜中。
# 设为 false 将隐藏 $0 或更低的余额。
# 注意：重新加载配置后，运行 '/baltop force' 才能使更改生效。
show-zero-baltop: true

# 玩家必须满足的条件，才能让其名字显示在余额排行榜中。
# 游戏时间以秒为单位。
baltop-requirements:
  minimum-balance: 0
  minimum-playtime: 0

# 限制缓存的余额排行榜条目的数量。
# 建议拥有大量玩家的服务器启用，因为它可以降低内存使用。
# 设为 -1 可禁用限制。
baltop-entry-limit: -1

# 货币的格式，不包括符号。有关符号配置，请参阅下面的 'currency-symbol-format-locale'。
#
# "#,##0.00" 是大多数国家显示货币的方式。
#currency-format: "#,##0.00"

# 格式化货币符号。某些语言区域会互换使用逗号和点号。
# 由于 Minecraft 字体渲染问题，某些格式可能无法在游戏中正确显示。
#
# 示例语言区域：
#  - de-DE for 1.234,50
#  - en-US for 1,234.50
#  - fr-CH for 1'234,50
#
# 或者参阅 https://www.iban.com/country-codes 获取所有 Alpha-2 国家代码。
#currency-symbol-format-locale: en-US

# 允许玩家从 /sell 或出售告示牌出售的物品中获得倍率加成。
# 你可以使用下面的 'default' 等级来设置默认倍率。
#
# 要向不同的人授予不同的倍率，你需要在下面定义一个"倍率等级"（multiplier rank）。
# 创建后，授予相应的权限：'essentials.sell.multiplier.<multiplier_rank>'。
# 注意：下面定义的"倍率等级"不需要与你的权限插件的组名匹配。
sell-multipliers:
  default: 1.0
  double: 2.0
  triple: 3.0

############################################################
# +------------------------------------------------------+ #
# |                         Help                         | #
# +------------------------------------------------------+ #
############################################################

# 在 Essentials 帮助列表中显示其他插件的命令。
non-ess-in-help: true

# 隐藏玩家没有权限使用的插件。
# 你可以通过向玩家或组添加 'essentials.help.<plugin>' 权限来覆盖此设置。
# 拥有 'essentials.*' 或 '*' 权限的玩家无论如何都能看到所有帮助。
# 如果启用此选项，你也可以使用负权限来移除对特定插件帮助的访问权限。
hide-permissionless-help: true

############################################################
# +------------------------------------------------------+ #
# |                   EssentialsX 聊天                   | #
# +------------------------------------------------------+ #
############################################################

# 你需要安装 EssentialsX Chat 模块才能使用此部分。
# 更多信息请参阅 https://essentialsx.net/wiki/Module-Breakdown.html

chat:

  # 如果已安装 Essentials Chat，此设置决定玩家聊天消息的传播范围（以方块为单位）。设为 0 表示全局聊天。
  # 拥有 'essentials.chat.spy' 权限的玩家无论此设置如何都能看到所有消息。
  # 拥有 'essentials.chat.shout' 权限的玩家可以通过在消息前加感叹号 (!) 来覆盖此设置。
  # 拥有 'essentials.chat.question' 权限的玩家可以通过在消息前加问号 (?) 来覆盖此设置。
  # 你可以通过在上方的 'command-costs' 部分添加 'chat-shout' 和 'chat-question' 来为喊话/提问设置命令费用。
  radius: 0

  # 聊天格式可以通过两种方式配置：
  #  - 所有聊天的标准格式（'format' 部分）
  #  - 特定于组的聊天格式以增加变化（'group-formats' 部分）
  #
  # 你可以使用权限来控制玩家是否可以在聊天消息中使用格式代码。
  # 更多信息请参阅 https://essentialsx.net/wiki/Color-Permissions.html
  #
  # 你也可以为每种聊天类型指定子格式。
  # 有关聊天格式的更多信息，请访问 wiki：https://wiki.ess3.net/wiki/Chat_Formatting#Chat_Formatting
  #
  # 可用占位符：
  # {MESSAGE} - 聊天消息的内容。
  # {USERNAME} - 发送者的用户名。
  # {DISPLAYNAME} - 发送者的显示名称。
  # {NICKNAME} - 发送者的 Essentials 昵称。如果发送者没有昵称，则显示用户名。
  # {PREFIX} - 发送者的前缀，由权限插件提供。
  # {SUFFIX} - 发送者的后缀，由权限插件提供。
  # {GROUP} - 发送者的主要组名，由权限插件提供。
  # {WORLD} - 发送者当前世界的世界别名。详情请参阅下方的 world-aliases 部分。
  # {WORLDNAME} - 发送者当前世界的完整名称。
  # {SHORTWORLDNAME} - 发送者当前世界的首字符。
  # {TEAMNAME} - 发送者的计分板队伍名称。
  # {TEAMPREFIX} - 发送者的计分板队伍前缀。
  # {TEAMSUFFIX} - 发送者的计分板队伍后缀。
  #
  # 注意：{DISPLAYNAME} 占位符默认包含 {PREFIX} 和 {SUFFIX}。
  # 将它们一起使用可能会导致聊天中出现重复的前缀/后缀。

  format: '<{DISPLAYNAME}> {MESSAGE}'
  #format: '&7[{GROUP}]&r {DISPLAYNAME}&7:&r {MESSAGE}'
  #format: '&7{PREFIX}&r {NICKNAME}&r &7{SUFFIX}&r: {MESSAGE}'

  # 你也可以为每种聊天类型指定格式。
  #format:
  #  normal: '{WORLDNAME} {DISPLAYNAME}&7:&r {MESSAGE}'
  #  question: '{WORLDNAME} &4{DISPLAYNAME}&7:&r {MESSAGE}'
  #  shout: '{WORLDNAME} &c[{GROUP}]&r &4{DISPLAYNAME}&7:&c {MESSAGE}'

  # 你也可以为每个组指定格式。
  # 如果使用组格式，请移除 # 以激活此设置。
  # 注意：组名区分大小写，因此你必须与权限插件中的名称保持一致。
  # 注意：如果设置了 LuckPerms 组显示名称（别名），你必须使用它而不是原始组名。
  group-formats:
    #default: '{WORLDNAME} {DISPLAYNAME}&7:&r {MESSAGE}'
    #admins: '{WORLDNAME} &c[{GROUP}]&r {DISPLAYNAME}&7:&c {MESSAGE}'

    # 你也可以为每个组的每种聊天类型指定格式。
    #admins:
    #  question: '{WORLDNAME} &4{DISPLAYNAME}&7:&r {MESSAGE}'
    #  shout: '{WORLDNAME} &c[{GROUP}]&r &4{DISPLAYNAME}&7:&c {MESSAGE}'

  # 世界别名允许你在聊天格式中将世界名称替换为其他内容。
  # 如果使用世界别名，请移除 # 以激活此设置。
  world-aliases:
    #plots: "&dP&r"
    #creative: "&eC&r"

  # 玩家是否默认处于喊话模式。
  shout-default: false

  # 玩家的喊话模式是否应在重启后保持。
  persist-shout: false

  # 是否应启用聊天提问功能。
  question-enabled: true

  # Essentials 是否应在 1.16.5+ 中使用 Paper 的现代聊天事件系统。
  # 这是悬停事件和点击事件等现代聊天功能所必需的。
  # 如果你在使用聊天事件系统的其他插件时遇到问题，可以禁用此选项。
  # 更改此设置后，你必须重启服务器。
  paper-chat-events: true

############################################################
# +------------------------------------------------------+ #
# |                  EssentialsX 保护                 | #
# +------------------------------------------------------+ #
############################################################

# 你需要安装 EssentialsX Protect 模块才能使用此部分。
# 更多信息请参阅 https://essentialsx.net/wiki/Module-Breakdown.html

protect:

  # 常规物理/行为修改。将这些选项设为 true 以禁用相应行为。
  prevent:
    lava-flow: false
    water-flow: false
    water-bucket-flow: false
    fire-spread: true
    lava-fire-spread: true
    lava-itemdamage: false
    flint-fire: false
    lightning-fire-spread: true
    portal-creation: false
    tnt-explosion: false
    tnt-playerdamage: false
    tnt-itemdamage: false
    tnt-minecart-explosion: false
    tnt-minecart-playerdamage: false
    tnt-minecart-itemdamage: false
    fireball-explosion: false
    fireball-fire: false
    fireball-playerdamage: false
    fireball-itemdamage: false
    windcharge-explosion: false
    witherskull-explosion: false
    witherskull-playerdamage: false
    witherskull-itemdamage: false
    wither-spawnexplosion: false
    wither-blockreplace: false
    creeper-explosion: false
    creeper-playerdamage: false
    creeper-itemdamage: false
    creeper-blockdamage: false
    ender-crystal-explosion: false
    enderdragon-blockdamage: true
    enderman-pickup: false
    villager-death: false
    bed-explosion: false
    respawn-anchor-explosion: false
    # 防止怪物跟随玩家。
    # 'essentials.protect.entitytarget.bypass' 权限可禁用此功能。
    entitytarget: false
    # 防止僵尸破坏门。
    zombie-door-break: false
    # 防止劫掠兽偷走方块。
    ravager-thief: false
    # 防止羊将草方块变成泥土。
    sheep-eat-grass: false
    transformation:
      # 防止苦力怕被闪电击中后变成高压苦力怕。
      charged-creeper: false
      # 防止村民变成僵尸村民。
      zombie-villager: false
      # 防止僵尸村民被治愈。
      villager: false
      # 防止村民被闪电击中后变成女巫。
      witch: false
      # 防止猪被闪电击中后变成僵尸猪灵。
      zombie-pigman: false
      # 防止僵尸变成溺尸，以及尸壳变成僵尸。
      drowned: false
      # 防止哞菇被闪电击中后改变颜色。
      mooshroom: false
    # 防止生物生成。如果缺少某种生物，你可以按照下面的格式添加它。
    spawn:
      creeper: false
      skeleton: false
      spider: false
      giant: false
      zombie: false
      slime: false
      ghast: false
      pig_zombie: false
      enderman: false
      cave_spider: false
      silverfish: false
      blaze: false
      magma_cube: false
      ender_dragon: false
      pig: false
      sheep: false
      cow: false
      chicken: false
      squid: false
      wolf: false
      mushroom_cow: false
      snowman: false
      ocelot: false
      iron_golem: false
      villager: false
      wither: false
      bat: false
      witch: false
      horse: false
      phantom: false

  # 苦力怕爆炸的最大高度。设为 -1 允许它们在任何地方爆炸。
  # 如果你想完全禁用苦力怕爆炸，请将上方的 'creeper-explosion' 设为 true。
  creeper:
    max-height: -1

  # 禁用各种默认物理/行为。
  disable:
    # 是否应禁用摔落伤害？
    fall: false

    # 是否应禁用 PvP？
    # 如果设为 true，拥有 'essentials.protect.pvp' 权限的玩家仍然可以互相攻击。
    # 但是，他们将无法攻击没有该权限节点的玩家。
    pvp: false

    # 是否应禁用溺水伤害？
    drown: false

    # 是否应禁用方块窒息伤害？
    suffocate: false

    # 是否应禁用岩浆伤害？
    # 掉入岩浆的物品仍然会被烧成灰烬。;)
    lavadmg: false

    # 是否应禁用投射物伤害，例如箭矢伤害？
    projectiles: false

    # 是否应禁用接触伤害？
    # 这包括接触仙人掌、滴水石、浆果丛等。
    contactdmg: false

    # 燃烧吧，宝贝，燃烧吧！是否应禁用火焰伤害？
    firedmg: false

    # 是否应禁用被闪电击中的伤害？
    lightning: false

    # 是否应禁用凋灵伤害？
    wither: false

    # 是否应禁用这些类型的天气？
    weather:
      storm: false
      thunder: false
      lightning: false

############################################################
# +------------------------------------------------------+ #
# |                 EssentialsX 防建造                | #
# +------------------------------------------------------+ #
############################################################

  # 你需要安装 EssentialsX AntiBuild 模块才能使用此部分。
  # 更多信息请参阅 https://essentialsx.net/wiki/Module-Breakdown.html 和 https://wiki.ess3.net/wiki/AntiBuild

    # 是否应禁止没有 'essentials.build' 权限的玩家建造？
    # 设为 false 意味着 Essentials AntiBuild 永远不会阻止玩家建造。
    build: true

    # 是否应禁止没有 'essentials.build' 权限的玩家使用物品？
    # 设为 false 意味着 Essentials AntiBuild 永远不会阻止玩家使用物品。
    use: true

    # 当玩家不被允许建造时，Essentials 是否应发送消息提醒？
    warn-on-build-disallow: true

  # 你希望针对哪些方块类型收到警报？
  # 你可以在 https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html 找到物品列表
  alert:
    on-placement: LAVA,TNT,LAVA_BUCKET
    on-use: LAVA_BUCKET
    on-break:

  blacklist:

    # 应禁止玩家放置哪些方块？
    placement: LAVA,TNT,LAVA_BUCKET

    # 应禁止玩家使用哪些物品？
    usage: LAVA_BUCKET

    # 应禁止玩家破坏哪些方块？
    break:

    # 哪些方块不应被活塞推动？
    piston:

    # 哪些方块不应被发射器发射？
    dispenser:

############################################################
# +------------------------------------------------------+ #
# |            EssentialsX 出生点 + 新玩家           | #
# +------------------------------------------------------+ #
############################################################

# 你需要安装 EssentialsX Spawn 模块才能使用此部分。
# 更多信息请参阅 https://essentialsx.net/wiki/Module-Breakdown.html

newbies:
  # 当玩家首次登录时，Essentials 是否应向服务器公告？
  # {DISPLAYNAME} 将被替换为玩家名称。
  # 设为 '' 以禁用。
  #announce-format: ''
  announce-format: '&dWelcome {DISPLAYNAME}&d to the server!'

  # 玩家首次出生时应使用哪个出生点？
  # 设为 'none' 以使用世界的出生点。
  # 可以使用 '/setspawn <group>' 设置不同的出生点名称。
  spawnpoint: newbies

  # 玩家首次加入时是否应获得物品？
  # 此礼包将无视费用和权限发放，且不会触发任何礼包延迟（冷却时间）。
  # 设为 '' 以禁用。
  #kit: ''
  kit: tools

# Essentials 处理重生时应使用什么优先级？
# 如果你想要原版重生行为，请设为 'none'。
# 如果你希望世界插件处理重生，请设为 'lowest'。
# 如果你希望 Essentials Spawn 处理重生，请设为 'high'。
# 如果你希望强制 Essentials Spawn 处理重生，请设为 'highest'。
# 注意：更改将在服务器重启后才会生效。
respawn-listener-priority: high

# Essentials 处理加入服务器时的出生应使用什么优先级？
# 可能的取值请参阅上方的 'respawn-listener-priority'。
# 注意：更改此选项可能会影响或破坏下方的 'spawn-on-join' 功能。
# 注意：更改将在服务器重启后才会生效。
spawn-join-listener-priority: high

# 玩家死亡时，是否应在他们的第一个家或床边重生，而不是在出生点？
respawn-at-home: false

# 玩家死亡时，是否应在他们的床边重生，而不是在第一个家或出生点？
# 上方的 'respawn-at-home' 设置也必须为 true，此选项才能生效。
respawn-at-home-bed: true

# 玩家死亡时，Essentials 是否应尊重他们的重生锚？
respawn-at-anchor: false

# 如果配置了此选项，玩家将在随机位置出生，而不是在出生点。
# 这将覆盖上方设置的新手出生点。
#
# 必须首先使用 /settpr 命令或在 'tpr.yml' 中设置该位置。
# 创建 tpr 位置后，在下方设置世界名称（或 'tpr.yml' 中定义的名称）。
random-spawn-location: "none"

# 如果配置了此选项，玩家死亡时将在随机重生位置重生。
# 更多位置信息请参阅上方的 'random-spawn-location'。
random-respawn-location: "none"

# 将所有加入的玩家传送到他们的出生点。
spawn-on-join: false
# 下面的 'guests' 值表示 'guests' 组中的所有玩家加入时将被传送到出生点。
#spawn-on-join: guests
# 下面的列表值表示 'guests' 或 'admin' 组中的所有玩家加入时将被传送到出生点。
#spawn-on-join:
#  - guests
#  - admin

# 文件结尾 <-- 说真的，配置已经完成了。
