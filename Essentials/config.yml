############################################################
# +------------------------------------------------------+ #
# |                         注释                         | #
# +------------------------------------------------------+ #
############################################################

# 这是 EssentialsX 的配置文件。
# 此配置是为版本 2.22.0 生成的。
# 在 https://git.io/JG4z1 查看最新的默认配置

# 如果你想在本文件中使用特殊字符（如带重音的字母），你必须将文件保存为 UTF-8 编码，而不是 ANSI。
# 如果 Essentials 加载时出现错误，请确保：
#  - 不存在制表符：YAML 只允许使用空格
#  - 缩进正确：YAML 的层级结构完全基于缩进
#  - 你已对文本中的所有撇号进行了"转义"：例如，如果你想写 "don't"，请写成 "don''t"（注意撇号要双写）
#  - 包含符号的文本要用单引号或双引号括起来

# 编辑完配置后，在游戏内运行 '/essentials reload' 以应用更改。

# 如果你需要帮助，可以加入 EssentialsX 社区：https://essentialsx.net/community.html

############################################################
# +------------------------------------------------------+ #
# |               EssentialsX（全局）                 | #
# +------------------------------------------------------+ #
############################################################

# 0-9 或 a-f 之间的颜色代码。设置为 'none' 可禁用。
# 在 1.16+ 中，你也可以在这里使用十六进制颜色代码（例如 #613e1d 是棕色）。
ops-name-color: '4'

# 用于给所有昵称添加前缀的字符，以便你知道它们不是真实用户名。
# 拥有 'essentials.nick.hideprefix' 权限的玩家不会被加上这些前缀字符。
nickname-prefix: '~'

# 昵称允许的最大长度。昵称前缀不计算在内。
max-nick-length: 16

# 用于判断所请求的昵称是否允许使用的正则表达式模式。
# 如果所请求的昵称不匹配此模式，该昵称将被拒绝。
# 拥有 'essentials.nick.allowunsafe' 权限的玩家可以绕过此检查。
allowed-nicks-regex: '^[a-zA-Z_0-9§]+$'

# 不能在昵称中使用的短语列表。你可以在此包含正则表达式。
# 拥有 'essentials.nick.blacklist.bypass' 权限的玩家可以绕过此过滤器。
nick-blacklist:
  #- Notch
  #- '^Dinnerbone'

# 启用此选项后，昵称长度检查将排除玩家名称中的颜色代码。
# 例如，如果 "&6Notch" 有 7 个字符（其中 2 个属于颜色代码），在此选项设为 true 时长度按 5 计算。
ignore-colors-in-max-nick-length: false

# 启用此选项后，当玩家的 Minecraft 账号名更改时，他们所设置的任何昵称都会被重置。
# 这可以防止旧昵称（包括 RGB 格式的昵称）在改名后继续存在。
reset-nick-on-name-change: false

# 启用此选项后，隐藏玩家的显示名称将不会显示。这可以防止玩家
# 在隐身状态下被看到在线。
hide-displayname-in-vanish: true

# 如果你有其他插件会修改玩家的显示名称，请禁用此项。
change-displayname: true

# 此选项将使 Essentials 在 Tab 补全 Essentials 命令时显示玩家的显示名称而不是用户名。
# 如果你的 Tab 补全中包含前缀和后缀，请将此选项设为 false。
change-tab-complete-name: false

# 当未使用 EssentialsChat.jar 时，强制 Essentials 将权限插件提供的前缀和后缀添加到显示名称中。
# 如果使用了 EssentialsChat.jar，此设置会被忽略，默认值为 true。
# 上面的 'change-displayname' 值必须为 true。
# 除非你知道自己在做什么，否则不要编辑此设置！
#add-prefix-suffix: false

# 启用此选项后，（Tab）玩家列表将更新为显示名称。
# 上面的 'change-displayname' 值必须为 true。
#change-playerlist: true

# 启用此选项后，（Tab）玩家列表中将显示玩家前缀。
# 此功能仅适用于 Minecraft 1.8 及以上版本。
# 上面的 'change-playerlist' 值必须为 true。
#add-prefix-in-playerlist: true

# 启用此选项后，（Tab）玩家列表中将显示玩家后缀。
# 此功能仅适用于 Minecraft 1.8 及以上版本。
# 上面的 'change-playerlist' 值必须为 true。
#add-suffix-in-playerlist: true

# 如果传送目的地不安全，是否应将玩家传送到最近的安全位置？
# 如果此项设为 true，Essentials 将尝试将玩家传送到靠近预期目的地的位置。
# 如果此项设为 false，传送到不安全位置的尝试将被取消并发出警告。
teleport-safety: true

# 尝试传送到不安全位置时，此项将强制禁用传送安全检查且不发出警告。
# 必须将上面的 'teleport-safety' 和此选项都设为 true，才能强制传送到危险位置。
force-disable-teleport-safety: false

# 如果玩家在创造、冒险或上帝模式下传送至不安全位置，他们将不会被传送到
# 安全位置。如果你希望玩家始终被传送到安全位置，请将此选项设为 true。
force-safe-teleport-location: false

# 将水方块视为"安全"的，从而允许玩家传送
# 使用 /home 或 /spawn 等命令传送到被水方块占据的位置。
is-water-safe: false

# 如果玩家有乘客，传送将失败。是否应在传送前让乘客下坐骑？
# 如果此项设为 true，Essentials 将在传送前让玩家的乘客下坐骑。
# 如果此项设为 false，传送尝试将被取消并发出警告。
teleport-passenger-dismount: true

# 两次 /home、/tp 等命令之间需要等待的时间（秒）。
teleport-cooldown: 0

# 玩家实际传送前的延迟时间（秒）。
# 如果玩家在此时间范围内移动或受到攻击，传送将被取消。
teleport-delay: 0

# 玩家被命令传送后无法被其他玩家攻击的持续时间（秒）。
# 这也将阻止该玩家攻击其他人。
teleport-invulnerability: 4

# 是否将所有传送都定位到方块中心，即 x 和 z 坐标的小数部分变为 .5。
teleport-to-center: true

# 两次 /heal 或 /feed 尝试之间需要等待的时间（秒）。
heal-cooldown: 60

# 治疗玩家时是否应移除药水效果？
remove-effects-on-heal: true

# 使用 /near 时的默认半径。
near-radius: 200

# 从 /item 和 /give 中禁止的物品。
# Example: item-spawn-blacklist: lava_bucket,tnt,end_crystal
item-spawn-blacklist:

# 如果你想要基于权限的物品生成规则，请将此设为 true。
# 注意：如果设为 true，上面的 'item-spawn-blacklist' 将被忽略。
# 示例权限（这些需要添加到你的权限管理插件中）：
#  - essentials.itemspawn.item-all
#  - essentials.itemspawn.item-[itemname]
#  - essentials.give.item-all
#  - essentials.give.item-[itemname]
#  - essentials.unlimited.item-all
#  - essentials.unlimited.item-[itemname]
#  - essentials.unlimited.item-waterbucket (无限放置水)
#
# 更多信息请访问 https://wiki.ess3.net/wiki/Command_Reference/ICheat#Item.2FGive
permission-based-item-spawn: false

# 每次使用 /spawnmob 命令最多可以生成的实体数量。
spawnmob-limit: 10

# 使用 /lightning 时，Essentials 是否应通知被雷击的玩家？
warn-on-smite: true

# 如果玩家背包已满，是否应将物品丢到玩家脚下，而不是不给予物品？
drop-items-if-full: false

# 如果玩家没有新邮件，Essentials 是否应通知他们？
notify-no-new-mail: true

# 指定玩家两次邮件通知之间的冷却时间（秒）。
# 适用于邮件流量较高的服务器。
notify-player-of-mail-cooldown: 60

# 当命令与其他插件冲突时，Essentials 默认会尝试强制让其他插件优先处理。
# 将命令加入此列表将告诉 Essentials 不要将这些命令"让给"其他插件。
# 在这种状态下，哪个插件会"获胜"看起来几乎是随机的。
#
# 如果你有两个插件拥有相同的命令，并希望强制 Essentials 接管，你必须设置一个别名。
# 要强制 Essentials 处理 '/god'，请在你服务器根目录下的 'commands.yml' 文件中将 'god' 设为 'essentials:god $1-' 的别名。
# 更多信息请参阅 https://breezewiki.com/bukkit/wiki/Commands.yml#aliases
overridden-commands:
  #- god
  #- info

# 在此禁用命令将阻止 Essentials 处理该命令；这不会影响命令冲突。
# 你不需要禁用其他插件使用的命令，因为它们会自动获得优先级。
# 请参阅 https://breezewiki.com/bukkit/wiki/Commands.yml#aliases 将命令映射到其他插件。
disabled-commands:
  #- nick
  #- clear

# Essentials 是否应显示详细的命令用法。
# 如果设为 false，Essentials 将把所有用法合并为一条用法消息。
verbose-command-usages: true

# 这些命令将对启用了 SocialSpy 的玩家显示。
# 你可以添加来自其他插件的命令进行跟踪。
# 移除任何你不想监视的命令。
# 移除 '*' 前面的 # 即可监听所有可能的命令。
socialspy-commands:
  #- '*'
  - action
  - describe
  - eaction
  - edescribe
  - email
  - eme
  - emsg
  - er
  - ereply
  - etell
  - ewhisper
  - m
  - mail
  - msg
  - pm
  - r
  - reply
  - t
  - tell
  - w
  - whisper

# 被禁言的玩家发送的私聊和公开消息是否应出现在 SocialSpy 中。
# 如果为 true，它们将与普通玩家发送的消息区分开来。
socialspy-listen-muted-players: true

# SocialSpy 除了监视上面列表中的命令外，是否还应监视私聊消息。
# 如果为 false，它将只监视上面列表中的命令。
socialspy-messages: true

# SocialSpy 是否应使用可能包含颜色的格式化显示名称。
# 如果为 false，它将只使用玩家的真实名称。
socialspy-uses-displaynames: true

# 以下世界设置用于监听玩家切换世界时的事件。
# 如果你使用其他插件来控制速度和飞行，应将这些设为 false。

# 当玩家切换世界时，Essentials 是否应重置他们的飞行状态？
# 如果玩家没有 'essentials.fly' 权限，这将禁用飞行。
world-change-fly-reset: true

# 从 1.17 开始，Minecraft 在玩家切换世界时不再保留玩家的能力。
# 将此设为 true 将使 Essentials 在玩家切换世界时保留飞行状态。
# 这仅在玩家拥有 'essentials.fly' 权限时才有效。
world-change-preserve-flying: true

# 当玩家切换游戏模式时，Essentials 是否应保留飞行状态？
# 启用后，如果玩家在切换游戏模式时正在飞行，他们的飞行状态将被保持。
# 这仅在玩家拥有 'essentials.fly' 权限时才有效。
gamemode-change-preserve-flying: false

# 当玩家切换世界时，Essentials 是否应根据其权限重置他们的速度？
# 如果玩家没有 'essentials.speed' 权限，这将把速度重置为默认值。
# 如果玩家没有 'essentials.speed.bypass' 权限，他们的速度将被重置为下面
# 的 'max-walk-speed' 和 'max-fly-speed' 中指定的最大值。
world-change-speed-reset: true

# 当玩家被禁言时，这些命令将被禁用。
# Essentials 默认已禁用其消息类命令。
# 它只关心根命令，而不关心其后的参数（它把 '/f chat' 视为与 '/f' 相同）。
# 移除 '*' 前面的 # 即可在被禁言时禁用所有命令。
mute-commands:
  #- '*'
  - f
  - kittycannon

# 如果你不想使用权限系统，可以在下面定义一个"玩家权限"列表。
# 如果你使用受支持的权限系统，此列表将不起作用。
# 如果你使用的是不受支持的权限系统，直接删除此部分即可。
# 将你希望默认赋予玩家的命令和权限加入白名单（其他所有内容仅限 OP）。
# 这些是去掉 'essentials.' 前缀部分的权限。
#
# 要启用此功能，请确保下面的 'use-bukkit-permissions' 设为 false。
player-commands:
