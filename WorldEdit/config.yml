use-inventory:
    enable: false
    allow-override: true
    creative-mode-overrides: false

logging:
    log-commands: false
    file: worldedit.log
    # 自定义日志消息的格式。这是 Java 通用格式字符串（java.util.Formatter）。参数依次为：
    #   1$ : date - 表示日志记录事件发生时间的 Date 对象。
    #   2$ : source - 表示调用者的字符串；如果没有调用者，则为记录器的名称。
    #   3$ : logger - 记录器的名称。
    #   4$ : level - 日志级别。
    #   5$ : message - 由 Formatter.formatMessage(LogRecord) 方法返回的格式化日志消息。它使用 java.text 格式化，不使用 java.util.Formatter 的格式参数。
    #   6$ : thrown - 表示与该日志记录关联的异常（throwable）及其回溯的字符串，以换行符开头；如果没有，则为空字符串。
    # 有关详细信息，请参阅：
    #   https://docs.oracle.com/javase/8/docs/api/java/util/Formatter.html
    #   https://docs.oracle.com/javase/8/docs/api/java/util/logging/SimpleFormatter.html#format-java.util.logging.LogRecord-
    format: "[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s]: %5$s%6$s%n"

super-pickaxe:
    drop-items: true
    many-drop-items: false

snapshots:
    directory:

navigation-wand:
    item: minecraft:compass
    max-distance: 100

scripting:
    timeout: 3000
    dir: craftscripts

saving:
    dir: schematics

files:
    allow-symbolic-links: false

history:
    size: 15
    expiration: 10

calculation:
    timeout: 100

debugging:
    trace-unflushed-sessions: false

wand-item: minecraft:wooden_axe
shell-save-type:
no-op-permissions: false
debug: false
show-help-on-first-use: true
server-side-cui: true
command-block-support: false
