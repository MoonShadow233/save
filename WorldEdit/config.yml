#
# WorldEdit 的配置文件
#
# 关于编辑此文件：
# - 请勿使用制表符（Tab）。你必须使用空格，否则 Bukkit 会报错并输出
#   错误信息。如果你使用编辑器，例如 Notepad++（推荐 Windows
#   用户使用），你必须将其配置为“用空格替换制表符”。
#   这可以在“设置 > 首选项 > 语言菜单”中更改。
# - 不要删除缩进。有些条目位于分类中，
#   例如 "max-blocks-changed" 被放在 "limits"
#   分类下。
# - 如果你想在放入 WorldEdit 前检查此文件的格式，请
#   将其粘贴到 http://yaml-online-parser.appspot.com/
#   并查看是否出现 "ERROR:"。
# - 以 # 开头的行是注释，因此会被忽略。
# - 如果你想允许某些方块，请确保将 "disallowed-blocks" 改为 []
#

limits:
    max-blocks-changed:
        default: -1
        maximum: -1
    vertical-height:
        default: 256
    max-polygonal-points:
        default: -1
        maximum: 20
    max-radius: -1
    max-super-pickaxe-size: 5
    max-brush-radius: 5
    butcher-radius:
        default: -1
        maximum: -1
    disallowed-blocks:
